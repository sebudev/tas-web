services:
  tas-web:
    build: .
    container_name: tas-web
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data
    environment:
      - TAS_PASSWORD=${TAS_PASSWORD:-}
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - API_TOKEN=${API_TOKEN:-}
      # batasi heap Node biar RSS nggak meledak di VPS 2GB (spawn ENOMEM)
      - NODE_OPTIONS=--max-old-space-size=512
      # ingest via Telegram bot: kirim file ke bot → otomatis masuk storage
      # (0 = matikan; default aktif kalau token bot ketemu di config profile)
      - BOT_INGEST=${BOT_INGEST:-1}
      # override manual token bot (opsional; default didekripsi dari config.json)
      - TAS_BOT_TOKEN=${TAS_BOT_TOKEN:-}
      # AI model (opencode-go) — key Hermes dari server, tidak pernah ke browser
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY:-}
    # TAS_DATA_DIR=/data sudah di-set di Dockerfile
    networks:
      - caddy_default
      - default

networks:
  caddy_default:
    external: true
