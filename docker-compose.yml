services:
  tas-web:
    build: .
    container_name: tas-web
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data
    environment:
      - TAS_PASSWORD=${TAS_PASSWORD:-}
    # TAS_DATA_DIR=/data sudah di-set di Dockerfile
    networks:
      - xbook-net

networks:
  xbook-net:
    external: true
