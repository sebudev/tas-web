services:
  tas-web:
    build: .
    container_name: tas-web
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data
    environment:
      - TAS_PASSWORD=${TAS_PASSWORD:-}
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - API_TOKEN=${API_TOKEN:-}
      # batasi heap Node biar RSS nggak meledak di VPS 2GB (spawn ENOMEM)
      - NODE_OPTIONS=--max-old-space-size=512
      # ingest via Telegram bot: kirim file ke bot → otomatis masuk storage
      # (0 = matikan; default aktif kalau token bot ketemu di config profile)
      - BOT_INGEST=${BOT_INGEST:-1}
      # override manual token bot (opsional; default didekripsi dari config.json)
      - TAS_BOT_TOKEN=${TAS_BOT_TOKEN:-}
      # AI model (opencode-go) — key Hermes dari server, tidak pernah ke browser
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY:-}
      # kunci enkripsi secret-at-rest (kosong = auto-generate di /data/.master.key)
      - TAS_MASTER_KEY=${TAS_MASTER_KEY:-}
      # CORS gateway S3 (default '*'; set allowlist origin dipisah koma)
      - S3_ALLOWED_ORIGINS=${S3_ALLOWED_ORIGINS:-*}
      # CORS API /api (kosong = same-origin; '*' = reflect Origin)
      - API_ALLOWED_ORIGINS=${API_ALLOWED_ORIGINS:-}
      # origin publik untuk presigned URL (mis. https://app-storage.sebudev.space)
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      # jumlah hop reverse proxy (Caddy = 1) → req.ip & req.secure benar
      - TRUST_PROXY=${TRUST_PROXY:-1}
      # batas request AI per menit per sesi/IP
      - AI_RATE_LIMIT=${AI_RATE_LIMIT:-20}
    # TAS_DATA_DIR=/data sudah di-set di Dockerfile
    networks:
      - caddy_default
      - default

networks:
  caddy_default:
    external: true
